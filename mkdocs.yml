site_name: Synapse Documentation
site_description: Self-hosted homelab operations and Axon integrations
site_url: https://wbw1537.github.io/Synapse/
repo_url: https://github.com/wbw1537/Synapse
repo_name: wbw1537/Synapse
edit_uri: edit/main/website/docs/
docs_dir: website/docs
site_dir: .build/site
strict: true
use_directory_urls: true

theme:
  name: material
  font: false
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Run Synapse:
      - Get started: getting-started.md
      - Configuration: configuration.md
      - Access and deployment: access.md
      - Operations: operations.md
  - Integrate an Axon:
      - Python SDK: python-sdk.md
      - TOML configuration: axon-toml.md
      - Discovery protocol: protocol.md
