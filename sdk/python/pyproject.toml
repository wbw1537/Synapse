[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-axon"
version = "0.1.0"
description = "Reference Python client for Synapse Axons"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]
